<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make Payment</title>
  <link rel="icon" href="../assets/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/student.css">
  <link rel="stylesheet" href="../src/css/medium.css?v=9">
  <style>
    :root { --mp-green: #4DB848; --mp-dark: #2E8B3A; --mp-tint: #EAF7E9; --mp-red: #D6232A; }
    .pay-box { max-width: 480px; background: #fff; border: 1px solid #d9eed8; border-top: 6px solid var(--mp-green); border-radius: 12px; padding: 22px 22px 26px; box-shadow: 0 4px 16px rgba(77,184,72,.15); }
    .pay-logo { height: 90px; max-width: 100%; object-fit: contain; display: block; margin: 0 auto 10px; }
    .pay-box h2 { color: var(--mp-dark); text-align: center; margin: 4px 0 8px; }
    .pay-box p { text-align: center; }
    #pay-balance { color: var(--mp-dark); font-size: 1.15em; }
    .pay-box label { display: block; margin: 16px 0 6px; font-weight: 500; color: var(--mp-dark); }
    .pay-box input { width: 100%; padding: 11px 12px; font: inherit; border: 1.5px solid #cfe8cd; border-radius: 8px; box-sizing: border-box; background: #fbfefb; }
    .pay-box input:focus { outline: none; border-color: var(--mp-green); box-shadow: 0 0 0 3px rgba(77,184,72,.25); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chips button { padding: 7px 13px; font: inherit; font-size: 13px; border: 1.5px solid var(--mp-green); background: var(--mp-tint); color: var(--mp-dark); border-radius: 999px; cursor: pointer; }
    .chips button:hover { background: var(--mp-green); color: #fff; }
    #pay-btn { margin-top: 20px; padding: 14px 18px; width: 100%; font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; cursor: pointer; background: var(--mp-green); color: #fff; }
    #pay-btn:hover:not(:disabled) { background: var(--mp-dark); }
    #pay-btn:disabled { opacity: .6; cursor: not-allowed; }
    #pay-msg { margin-top: 14px; font-weight: 500; text-align: center; }
    #pay-msg.ok { color: var(--mp-dark); }
    #pay-msg.bad { color: var(--mp-red); }
    .pay-hist { margin-top: 26px; width: 100%; border-collapse: collapse; }
    .pay-hist th { text-align: left; padding: 8px 6px; font-size: 13px; background: var(--mp-tint); color: var(--mp-dark); }
    .pay-hist td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e3f1e2; font-size: 14px; }
  </style>
</head>
<body data-page="pay">
  <div id="content" class="left-col">
    <div class="crumb">Make Payment</div>
    <div class="welcome pay-box">
      <img class="pay-logo" src="../assets/mpesa.png" alt="M-PESA" onerror="this.style.display='none'">
      <h2>Payments</h2>
      <p>Outstanding balance: <strong id="pay-balance">...</strong></p>

      <label for="pay-amount">Amount to pay</label>
      <input id="pay-amount" type="number" min="1" step="0.01" inputmode="decimal" placeholder="Enter amount">
      <div class="chips" id="pay-chips"></div>

      <label for="pay-phone">M-Pesa phone number</label>
      <input id="pay-phone" type="tel" inputmode="tel" placeholder="e.g. 0712345678" autocomplete="tel">

      <button id="pay-btn" type="button">Pay with M-Pesa</button>
      <div id="pay-msg"></div>

      <table class="pay-hist" id="pay-hist" style="display:none">
        <thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="../src/js/config.js"></script>
  <script src="../src/js/student.js"></script>
  <script>
  (function () {
    var store = localStorage.getItem("portal_token") ? localStorage : sessionStorage;
    var token = store.getItem("portal_token");
    var balEl = document.getElementById("pay-balance");
    var amtEl = document.getElementById("pay-amount");
    var phoneEl = document.getElementById("pay-phone");
    var chipsEl = document.getElementById("pay-chips");
    var btn = document.getElementById("pay-btn");
    var msg = document.getElementById("pay-msg");
    var hist = document.getElementById("pay-hist");
    var currency = "KES", minAmt = 10, balance = 0;

    function say(text, cls) { msg.textContent = text; msg.className = cls || ""; }
    function money(n) { return currency + " " + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    async function call(path, opts) {
      var res = await fetch(API_BASE + path, Object.assign({}, opts, {
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }
      }));
      var data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Check the amount and phone number");
      return data;
    }

    function drawHistory(list) {
      var body = hist.querySelector("tbody");
      body.innerHTML = "";
      list.forEach(function (p) {
        var tr = document.createElement("tr");
        [p.date, money(p.amount), p.status, p.reference].forEach(function (v) {
          var td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      hist.style.display = list.length ? "" : "none";
    }

    function drawChips() {
      chipsEl.innerHTML = "";
      var opts = [["Full balance", balance], ["Half", Math.round(balance / 2)], ["1,000", 1000], ["5,000", 5000]];
      var seen = {};
      opts.forEach(function (o) {
        var v = Math.round(o[1] * 100) / 100;
        if (v < minAmt || v > balance || seen[v]) return;
        seen[v] = true;
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = o[0] === "Full balance" || o[0] === "Half" ? o[0] + " (" + v.toLocaleString() + ")" : v.toLocaleString();
        b.addEventListener("click", function () { amtEl.value = v; });
        chipsEl.appendChild(b);
      });
    }

    async function load() {
      var s = await call("/payments/summary");
      currency = s.currency; minAmt = s.min_amount; balance = s.balance;
      balEl.textContent = money(balance);
      amtEl.max = balance;
      if (balance <= 0) { btn.disabled = true; amtEl.disabled = true; phoneEl.disabled = true; }
      drawChips();
      drawHistory(s.online_payments);
    }

    async function waitForPayment(ref) {
      for (var i = 0; i < 25; i++) {
        await wait(4000);
        var r = await call("/payments/verify/" + encodeURIComponent(ref));
        if (r.status === "success") return "success";
        if (r.status === "failed") return "failed";
      }
      return "pending";
    }

    btn.addEventListener("click", async function () {
      var amount = parseFloat(amtEl.value);
      var phone = phoneEl.value.trim();
      if (!amount || amount <= 0) { say("Enter a valid amount", "bad"); return; }
      if (!phone) { say("Enter your M-Pesa phone number", "bad"); return; }
      btn.disabled = true; say("Sending request to your phone...");
      try {
        var r = await call("/payments/mpesa", { method: "POST", body: JSON.stringify({ amount: amount, phone: phone }) });
        say(r.message + ". Waiting for confirmation...");
        var result = await waitForPayment(r.reference);
        if (result === "success") say("Payment received. Thank you.", "ok");
        else if (result === "failed") say("Payment was not completed. You have not been charged.", "bad");
        else say("We have not received the payment yet. If M-Pesa deducted money, refresh this page in a minute.");
        amtEl.value = "";
        await load();
      } catch (e) { say(e.message, "bad"); }
      btn.disabled = balance <= 0;
    });

    (async function () {
      if (!token) { say("Not signed in", "bad"); return; }
      try { await load(); } catch (e) { say(e.message, "bad"); }
    })();
  })();
  </script>
</body>
</html>
