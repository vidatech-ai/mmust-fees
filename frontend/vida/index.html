<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Sign in</title>
  <link rel="icon" href="../assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/main.css?v=5">
</head>
<body class="login-page">
  <main class="split">
    <section class="hero" aria-hidden="true">
      <h2>UNIVERSITY OF CHOICE</h2>
    </section>

    <section class="panel">
      <div class="panel-inner">
        <img class="logo" src="../assets/logo.jpg" alt="Logo">
        <h1>Admin sign in</h1>
        <p class="sub">Authorised access only</p>

        <form id="adminForm" class="card" novalidate>
          <label for="user">Username</label>
          <input id="user" type="text" autocomplete="username" placeholder="Admin username" required>

          <label for="pw">Password</label>
          <div class="pw-wrap">
            <input id="pw" type="password" autocomplete="current-password" required>
            <button type="button" id="togglePw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <p id="msg" class="msg" role="alert" hidden></p>
          <button type="submit" id="submitBtn" class="btn">Sign in</button>
        </form>

        <p class="copy">Copyright &copy; 2026- ABNO Softwares International</p>
      </div>
    </section>
  </main>

  <script src="../src/js/config.js"></script>
  <script src="../src/js/admin-login.js"></script>
</body>
</html>
