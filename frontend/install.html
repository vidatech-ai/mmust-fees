<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Install C-Med MMUST</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0b3a7e">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Poppins, Arial, sans-serif; background: #f1f3f9; }
    .card { background: #fff; width: 90%; max-width: 380px; padding: 30px 24px; border-radius: 14px; text-align: center; box-shadow: 0 6px 24px rgba(11,58,126,.15); }
    .card img { width: 110px; height: 110px; object-fit: contain; }
    h1 { color: #0b3a7e; font-size: 22px; margin: 12px 0 6px; }
    p { color: #444; font-size: 14px; }
    #installBtn { margin-top: 12px; width: 100%; padding: 14px; font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: #0b3a7e; color: #fff; cursor: pointer; }
    #installNote { margin-top: 14px; font-size: 13px; }
    a { color: #0b3a7e; }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/logo.jpg" alt="">
    <h1>C-Med MMUST</h1>
    <p>Install the student portal on your phone to check fees, statements, payments and timetable.</p>
    <button id="installBtn" type="button">Install app</button>
    <p id="installNote"></p>
    <p><a href="index.html">Or continue in the browser</a></p>
  </div>
  <script src="src/js/pwa.js"></script>
</body>
</html>
